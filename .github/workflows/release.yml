name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COLUMNS: "80"
  SAMPLE: tests/data/view/sample.json

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo publish --workspace --dry-run --locked
      - run: cargo build --release --locked -p pycg
      - run: sh tools/release/packaged.sh
      - name: The program installed from the packages is the workspace's
        run: |
          mkdir -p reference
          target/release/pycg --help > reference/help.txt
          target/release/pycg view "$SAMPLE" -o reference/page.html
          target/packaged/root/bin/pycg --help > help.txt
          target/packaged/root/bin/pycg view "$SAMPLE" -o page.html
          cmp help.txt reference/help.txt
          cmp page.html reference/page.html
      - name: Licences of every target
        run: |
          mkdir -p licences
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
            x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            python3 tools/release/licences.py "$target" > "licences/$target.txt"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference
          path: |
            reference
            licences

  build:
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.symlinks true && git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add "${{ matrix.target }}"
      - run: cargo build --release --locked -p pycg --target "${{ matrix.target }}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reference
      - name: The program runs and writes the reference page
        run: |
          program="target/${{ matrix.target }}/release/pycg"
          "$program" --help > help.txt
          head -n 1 help.txt | grep -q '^usage: pycg'
          "$program" view "$SAMPLE" -o page.html
          cmp page.html reference/page.html
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - name: The program gives every micro-benchmark case its expected call graph
        run: uv run --no-project python -I tools/release/micro.py "target/${{ matrix.target }}/release/pycg"
      - name: Archive
        run: |
          name="pycg-$(git describe --tags --always)-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/pycg* "$name/"
          rm -f "$name"/*.d "$name"/*.pdb
          cp LICENCE "$name/LICENCE"
          cp "licences/${{ matrix.target }}.txt" "$name/THIRD_PARTY_LICENCES"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: pycg-*.*

  checksums:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
      - run: sha256sum pycg-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            pycg-*
            SHA256SUMS
