name: Parity

on:
  pull_request:
    branches:
      - base/rust-rewrite
  push:
    branches:
      - base/rust-rewrite

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EVAL_OUT: /tmp/pycg-evaluation

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        set: [micro, macro]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        run: echo "key=$(make -s parity-key)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: parity-oracle-${{ matrix.set }}-${{ steps.key.outputs.key }}
          path: |
            ${{ env.EVAL_OUT }}/parity-oracle-${{ steps.key.outputs.key }}/seed-0/${{ matrix.set }}
            ${{ env.EVAL_OUT }}/parity-oracle-${{ steps.key.outputs.key }}/done-${{ matrix.set }}
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: make parity-oracle PARITY_SETS=${{ matrix.set }}
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: parity-oracle-${{ matrix.set }}-${{ steps.key.outputs.key }}
          path: |
            ${{ env.EVAL_OUT }}/parity-oracle-${{ steps.key.outputs.key }}/seed-0/${{ matrix.set }}
            ${{ env.EVAL_OUT }}/parity-oracle-${{ steps.key.outputs.key }}/done-${{ matrix.set }}

  rust:
    needs: oracle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - id: key
        run: echo "key=$(make -s parity-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: parity-oracle-micro-${{ steps.key.outputs.key }}
          fail-on-cache-miss: true
          path: |
            ${{ env.EVAL_OUT }}/parity-oracle-${{ steps.key.outputs.key }}/seed-0/micro
            ${{ env.EVAL_OUT }}/parity-oracle-${{ steps.key.outputs.key }}/done-micro
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: parity-oracle-macro-${{ steps.key.outputs.key }}
          fail-on-cache-miss: true
          path: |
            ${{ env.EVAL_OUT }}/parity-oracle-${{ steps.key.outputs.key }}/seed-0/macro
            ${{ env.EVAL_OUT }}/parity-oracle-${{ steps.key.outputs.key }}/done-macro
      - run: make eval-inputs
      - run: make parity SUMMARY="$GITHUB_STEP_SUMMARY"
