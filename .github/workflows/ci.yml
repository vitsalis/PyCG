name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EVAL_OUT: /tmp/pycg-evaluation

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: make setup
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: make setup
      - run: make test

  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [eval-measure-pr, eval-measure-seed1, eval-measure-base]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: make ${{ matrix.target }} BASE=HEAD^1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.EVAL_OUT }}
          if-no-files-found: error
          retention-days: 7

  gate:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      metrics-changed: ${{ steps.labels.outputs.metrics-changed }}
      benchmark-changed: ${{ steps.labels.outputs.benchmark-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eval-measure-*
          path: ${{ env.EVAL_OUT }}
          merge-multiple: true
      - run: make eval-compare BASE=HEAD^1 SUMMARY="$GITHUB_STEP_SUMMARY"
      - id: labels
        if: ${{ !cancelled() }}
        run: make eval-labels BASE=HEAD^1 SUMMARY="$GITHUB_STEP_SUMMARY" LABELS="$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        run: make eval-gate BASE=HEAD^1
      - if: ${{ !cancelled() }}
        run: make eval-same-graphs

  label:
    needs: gate
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gate.outputs.metrics-changed != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          METRICS_CHANGED: ${{ needs.gate.outputs.metrics-changed }}
          BENCHMARK_CHANGED: ${{ needs.gate.outputs.benchmark-changed }}
        run: |
          set -eu
          issue="repos/$REPOSITORY/issues/$NUMBER/labels"
          present=$(gh api "$issue" --jq '.[].name')
          set_label() {
            if [ "$2" = true ]; then
              gh api --method POST "$issue" -f "labels[]=$1" > /dev/null
              echo "$1: set"
            elif printf '%s\n' "$present" | grep -qx "$1"; then
              gh api --method DELETE "$issue/$1" > /dev/null
              echo "$1: removed"
            else
              echo "$1: not set"
            fi
          }
          set_label metrics-changed "$METRICS_CHANGED"
          set_label benchmark-changed "$BENCHMARK_CHANGED"
