[project]
name = "pycg"
version = "0.1.0.dev0"
description = "Practical Python Call Graphs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENCE"]
authors = [{ name = "Vitalis Salis", email = "vitsalis@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
pycg = "pycg.__main__:main"

[project.urls]
Homepage = "https://github.com/vitsalis/PyCG"
"Bug Tracker" = "https://github.com/vitsalis/PyCG/issues"

[dependency-groups]
dev = ["pytest>=9.2", "ruff==0.17.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
line-length = 88
extend-exclude = ["micro-benchmark/snippets", "micro-benchmark-key-errs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
