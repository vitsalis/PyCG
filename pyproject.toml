[project]
name = "pycg-harness"
version = "0"
requires-python = ">=3.14"

[tool.uv]
package = false

[dependency-groups]
dev = ["hypothesis==6.170.12", "pytest>=9.2", "ruff==0.17.4"]

[tool.pytest.ini_options]
testpaths = ["evaluation/tests", "tools/tests"]
markers = ["slow: a module that takes seconds; make check leaves it out"]
filterwarnings = ["error"]
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
line-length = 88
extend-exclude = [
    "evaluation/micro-benchmark/snippets",
    "tools/tests/fixtures",
    "tests/cases",
    "evaluation/macro-benchmark/projects",
    "evaluation/macro-benchmark/selection/*/audits",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
