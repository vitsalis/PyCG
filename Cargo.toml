[workspace]
resolver = "3"
members = [
    "crates/syntax",
    "crates/stubs",
    "crates/solver",
    "crates/analysis",
    "crates/document",
    "crates/pycg",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
authors = ["Vitalis Salis <vitsalis@gmail.com>"]
repository = "https://github.com/vitsalis/PyCG"
publish = true

[workspace.dependencies]
pycg-syntax = { version = "=2.0.0", path = "crates/syntax" }
pycg-stubs = { version = "=2.0.0", path = "crates/stubs" }
pycg-solver = { version = "=2.0.0", path = "crates/solver" }
pycg-analysis = { version = "=2.0.0", path = "crates/analysis" }
pycg-document = { version = "=2.0.0", path = "crates/document" }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
