# The projects of the macro-benchmark: 60 projects, each pinned at `commit`
# (the commit of the release `tag` of its `repository`) or at the SHA-256 of
# its sdist: the only lock. The build of the inputs image
# (evaluation/container/Dockerfile.inputs, fetch.py macro) writes the files
# of each project into /inputs/macro-benchmark/projects/<name> (projects/<name>
# below: the project's directory).
#
# Read by trace.py, check.py and the evaluation:
#   batch         the batch that the project came with: 1 to 8, in the
#                 order in which the batches were built (6 to 8: ten
#                 projects each), or
#                 "icse-2021" for the five projects of PyCG's ICSE 2021
#                 evaluation (README.md, "How the benchmark grew")
#   root          directory that is put on sys.path; module names are
#                 relative to it (relative to projects/<name>)
#   packages      package directories or module files (`name.py`), the
#                 analysed source (relative to root)
#   exclude       paths in the packages that are not analysed (relative to
#                 projects/<name>)
#   dependencies  top-level modules of installed packages that the package
#                 calls; their code is library code, not client code
#   pytest_args   test paths and arguments of pytest, run in projects/<name>;
#                 explicit paths, so that pytest collects nothing else
#   pytest_config the project's own pytest configuration file (relative to
#                 projects/<name>); without it, pytest runs with no
#                 configuration (-c /dev/null)
#   deselect      tests that are not run: {test = node id, reason = why}
#   plugins       pytest plugins that the trace loads: .py files of the
#                 benchmark directory, outside projects/ (relative to it)
#   test_requirements
#                 what the test environment has installed: name or
#                 name==version; trace.py refuses an environment that differs
#   also_installed
#                 packages of the project that the test environment also
#                 installs (pytest requires pluggy): `trace.py --locate`
#                 accepts their installed copy; the run still checks that
#                 the package was imported from the checkout
#   not_importable
#                 packages of the project that the test environment cannot
#                 import (they need a library that it lacks): the run does not
#                 require them to be imported, and fails on an edge from or to
#                 them; the reason goes in the notes
#   environment   variables of the test run: {NAME = "value"}; trace.py adds
#                 them to its environment and the trace records them; a name
#                 that trace.py sets, or PYTHON*, PYTEST*, LD_*, LC_*, is
#                 refused
#   commit        the lock: the build of the inputs image fetches the files
#                 of this commit, and fails if it cannot
#   sdist, sdist_url, sdist_sha256
#                 in place of repository, tag and commit: the source is a
#                 source archive from PyPI, by file name, https URL and
#                 SHA-256. The build of the inputs image downloads it, checks
#                 the SHA-256 and unpacks it; the archive is not kept
#
# A project without pytest_args and test_requirements has no test run: its
# ground truth comes from reading only, and trace.py refuses it.
#
# test-environments/<name>.txt is the test environment of each project with a
# test run, for the trace service: the full closure, each file by version
# and SHA-256; test_requirements repeats the versions.
#
# A security scan of the sources came before any run of batches 3 to 8 and
# of the ICSE 2021 set; the entries hold its restrictions. The scan of
# batches 1 and 2 came after their traces (README.md, "Projects").
#
# Documentation only (read from the project's tox.ini, pyproject.toml and
# requirement files):
#   upstream_test_command, notes

# --------------------------------------------------------------------------
# Batch 1: the projects that the analysis was first developed on.
# --------------------------------------------------------------------------
