[argcomplete]
batch = 3
repository = "https://github.com/kislyuk/argcomplete"
tag = "v3.7.2"
commit = "0571dc489d9543b40f1bcbc6cbac4377906b76fd"
licence = "Apache-2.0"
root = "."
packages = ["argcomplete"]
exclude = []
dependencies = []
pytest_args = [
    "test/test.py::TestArgcomplete",
    "test/test.py::TestArgcompleteREPL",
    "test/test.py::TestSplitLine",
    "test/test.py::TestCheckModule",
    "test/test.py::Warn",
    "--capture=sys",
    "-p",
    "no:faulthandler",
]
upstream_test_command = "coverage run --source=argcomplete --omit=argcomplete/packages/_shlex.py ./test/test.py -v"  # Makefile test, .github/workflows/ci.yml
test_requirements = [
    "pytest==9.2.0",
    "iniconfig==2.3.1",
    "packaging==26.3",
    "pluggy==1.7.0",
    "Pygments==2.21.0",
    "pexpect==4.9.0",
    "ptyprocess==0.7.0",
]  # extra "test": coverage, pexpect, wheel, ruff, mypy (unpinned); see test-environments/argcomplete.txt
notes = """
The suite is a unittest file, test/test.py. pytest_args select the five
in-process classes (53 tests). --capture=sys and -p no:faulthandler: the
completion finder opens file descriptor 9 for its debug output whenever it
is open (finders.py _init_debug_stream, its shell protocol) and closes it
when the next call replaces that stream. pytest's fd capture and its
faulthandler plugin hold descriptors up to 11, so the package closed
pytest's descriptors, then the tests' temporary files (EBADF in every
TestArgcomplete test, and a crash of pytest at exit). With capture by sys
and no faulthandler, pytest holds descriptors below 6 and fd 9 is closed,
as under the project's own runner (python test/test.py). Not run: the real-shell classes (TestBash,
TestZsh, TestBashGlobal, TestZshGlobalExplicit, TestZshGlobalImplicit).
They spawn interactive bash and zsh under a pty, which source ~/.bashrc and
write history files; 12 of them pip-install test/test_package from PyPI;
they need argcomplete installed; and their completions run in child
processes, which the tracer does not record. The mixins TestShellBase,
TestBashZshBase and TestBashZshGlobalBase are not TestCase classes but match
pytest's Test* pattern; naming the five classes keeps them out. The
in-process tests run `bash -c` (compgen) and `bash -n` as subprocesses, so
bash must be on PATH. TempDir(dir=".") makes and removes test_dir_*
directories in the working directory, the checkout: a killed run can leave
one behind. Not exercised: argcomplete/scripts/ and _check_console_script.py
(their functions get no trace). argcomplete/packages/_shlex.py is a modified
copy of Python 3.6's shlex and part of the package. test/__init__.py makes
`test` a package; with an interpreter without CPython's `test` package it
cannot be confused with the standard library's.
"""

