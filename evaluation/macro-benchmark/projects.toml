with a file lock) and the Redis and PostgreSQL tests skip; no test
connects to a server. The multiprocess bucket starts one
multiprocessing.Manager() server process per bucket (the parameter
mpbucket, and _mp in test_fixed_window.py and test_gcra.py): the package
code runs in the test process, the manager holds a list. On Python 3.14
such a child starts through forkserver, which imports the main script,
trace.py, again in the child, and the lock needs /dev/shm: UNVERIFIED that
it works under the tracer (if not, -m "not mpbucket" removes the items
with the marker; the lead decides). Threads: the package's Leaker (a
daemon thread with an asyncio loop) and ThreadPoolExecutor and Thread in
the tests. SQLite databases and lock files go to TMPDIR. Two tests
unpickle objects that they pickled. Many tests sleep and assert on
durations (cost <= 50 ms in tests/helpers.py, dt < 0.15 s, elapsed <
0.3 s); upstream reruns a failed test twice (pytest-retry) and runs in
parallel. UNVERIFIED: that the suite ends within 600 s in one process
under the tracer, and that the timing assertions hold there on every run.
The release is 25 days older than the scan; its PyPI files have publish
attestations from the project's workflow build_test.yml. Imports from
outside the standard library: filelock, redis, psycopg and psycopg_pool
(inside functions or under TYPE_CHECKING), and aiohttp, httpx, httpx2 and
requests at the top of the four modules of pyrate_limiter/extras (no test
that runs imports any of the four: their edges will come from reading
only).
"""

