notes = """
dagster-pipes is python_modules/dagster-pipes of the dagster monorepo
(https://github.com/dagster-io/dagster); the draw pinned its release tag
1.13.28 at commit 273178a5 (round-2.json). By the maintainer's ruling the
benchmark holds the package as its sdist from PyPI, not as a submodule of
the monorepo (1.46 GiB). The sdist is tied to the tag: unpacked, its files
other than PKG-INFO and .gitignore (the monorepo's root file, which the
build adds) are the 14 files of python_modules/dagster-pipes at that commit,
git tree a27c35a06bb86d3383aebda667f42e8d2f2d7397, byte for byte (security
scan); trace_helper.py checks that the file name names the release of the
round log. The fetch service downloads it, checks its SHA-256, unpacks it
into projects/dagster-pipes and writes the fetch record of the unpacked
files; the archive is not kept.
The analysed source is dagster_pipes/ (__init__.py and version.py); the draw
counted it and the wheel equals it. The tests run are the package's own,
dagster_pipes_tests (20 tests by reading); they import only dagster_pipes,
pytest and the standard library, although the dependency group test
installs the dagster framework. Not run: the pipes tests of dagster core
