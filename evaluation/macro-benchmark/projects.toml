# ce37eb5, data/macro-benchmark/projects). Only autojump's commit is a
# release tag (`tag`); the four others are commits between releases, and
# their entries have no `tag`. The ground truths are new, written under the
# current conventions, independently of the 2021 ground truths and of every
# tool.
# --------------------------------------------------------------------------
