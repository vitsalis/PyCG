on the 2.0 branch, 11 commits after the tag 2.0.5 (fabric/_version.py:
2.0.5). Supported: Python 2.7 and 3.4+ (README.rst:4 and
sites/www/installing.rst:105; the classifiers impose no upper bound; CI also PyPy).
