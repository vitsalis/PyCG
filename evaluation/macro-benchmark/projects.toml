asciinema.pty.record). They import assert_equal and assert_raises from
nose.tools; nose 1.3.7 does not import on Python 3.12 and later (it imports
imp), so plugins/nose_tools.py gives them unittest's assertEqual and
assertRaises, as nose.tools defines them. pytest does not call the
nose-style setUp and tearDown of the plain test classes: TestRecord's patch
of os.write is not applied, and the child's output also goes to fd 1
(pytest's capture). tests/pty_test.py forks the process under a pty and
execs python3, found on PATH (the interpreter's directory); the tracer
records the parent only. If that exec failed, the forked copy would go on
running pytest. config_test.py and v2_test.py write files under TMPDIR
(tempfile.mkdtemp, mkstemp). Not run: tests/integration.sh (the command
line in subprocesses: rec under a pty, play, cat, auth, pkill) and
tests/distros.sh (Docker builds).
"""

