test_requirements = [
    "pytest==9.2.0",
    "iniconfig==2.3.1",
    "packaging==26.3",
    "pluggy==1.7.0",
    "Pygments==2.21.0",
    "mock==5.2.0",
]  # tox.ini deps: mock, coverage, ipdb, ipython, pytest>=2.9 (unpinned); see test-environments/autojump.txt
notes = """
An application, not a package: bin/ holds the program, and its modules
import each other as top-level modules (root = "bin"). Analysed: the three
modules that the script bin/autojump imports from bin/. Not analysed:
bin/autojump itself, the main script (248 code lines, 11 functions and 6
lambdas), because it has no .py suffix and the tools read .py files only
(a ruling for the maintainer); bin/autojump_argparse.py, a vendored copy of
argparse 1.2.1 for Python 2.6, changed only by formatters (only
bin/autojump, install.py and uninstall.py import it); install.py,
uninstall.py, tools/autojump_ipython.py, tests/. The 2021 selection was
bin/*.py, with autojump_argparse.py. Supported: Python 2.6+ and 3.3+
(README; tox: py26, py27, py33 to py35), so the Python 2 branches run.
Test run: tests/unit, 32 tests by reading (5 skip on Python 3, 4 are
xfail). They append <working directory>/bin, the root, to sys.path.
autojump_utils_test.py imports mock, the PyPI package. No pytest_config:
the [pytest] of tox.ini only sets norecursedirs; --strict and the coverage
run are not needed. tests/integration/ is empty. test_in_bash sets
os.environ["SHELL"] and does not restore it. The tests call match_anywhere
and match_consecutive, and the functions of autojump_utils; no test calls
a function of autojump_data.
"""

