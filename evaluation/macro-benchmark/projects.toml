Analysed: the package asciinema/. Not analysed: tests/, setup.py, doc/,
man/. The 2021 selection was the same. The commit is on the develop branch,
after the tag v2.0.0 and before v2.1.0 (asciinema/__init__.py: 2.0.2; the
