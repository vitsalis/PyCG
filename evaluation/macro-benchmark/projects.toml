prefect): they are not in the sdist, they need the dagster framework, and
many start subprocesses, cloud clients or clusters. Two tests of
test_log_writer.py each start `tee` (from /usr/bin) once per stream, four
processes in all, and point file descriptors 1 and 2 at them for several
seconds per test (two redirect windows); the code does not wait for the tee
processes, the tracer's group kill ends any that remain, and they are
outside the trace. Imports from outside
the standard library: none at module level; pyspark and py4j inside a try,
in Databricks-only code; google.cloud.storage under TYPE_CHECKING. The
Databricks and cloud code is source (lead's ruling).
"""

