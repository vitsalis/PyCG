# The scale set: 20 large packages on which PyCG's time and peak memory are
# measured (evaluation/scale/README.md). They are not part of the
# benchmark: they have no ground truth and are not scored. Each is pinned at
# the SHA-256 of one archive: the only lock. The build of the inputs image
# (evaluation/container/Dockerfile.inputs, fetch.py scale) downloads it,
# checks the SHA-256, and writes its Python sources and its licence and
# notice files into /inputs/scale/projects/<name>; `make eval-inputs` copies
# them to projects/<name> here (the package's directory).
#
#   version   the release of a wheel, or the commit of a git archive
#   kind      "pure wheel" or "platform wheel" (a wheel of PyPI, unpacked),
#             or "git archive" (the archive of a commit that GitHub serves,
#             unpacked without its top directory)
#   file      the archive's file name
#   url       where the build downloads it (https)
#   sha256    the SHA-256 of the archive; the build fails on another
#   licence   the licence of the package, read from its own files
#   root      directory that is put on sys.path; module names are relative
#             to it (relative to projects/<name>)
#   packages  package directories, the analysed source (relative to root)

